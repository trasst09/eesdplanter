<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Garden Sensor Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f3;
      color: #1f2933;
    }

    header {
      background: #2e7d32;
      color: white;
      padding: 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
      font-size: 16px;
      opacity: 0.9;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .status {
      text-align: center;
      margin-bottom: 20px;
      color: #4b5563;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h2 {
      margin: 0;
      font-size: 18px;
      color: #4b5563;
    }

    .value {
      margin-top: 12px;
      font-size: 36px;
      font-weight: bold;
      color: #2e7d32;
    }

    .unit {
      font-size: 18px;
      color: #6b7280;
    }

    .section-title {
      font-size: 24px;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #e8f5e9;
      color: #1b5e20;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .on {
      color: #1565c0;
      font-weight: bold;
    }

    .off {
      color: #c62828;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #6b7280;
      margin: 40px 0 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Garden Sensor Dashboard</h1>
    <p>Live data from ESP8266</p>
  </header>

  <div class="container">
    <div class="status" id="status">
      Loading latest data...
    </div>

    <div class="cards">
      <div class="card">
        <h2>Soil Moisture</h2>
        <div class="value" id="moisture">--</div>
        <div class="unit">raw value</div>
      </div>

      <div class="card">
        <h2>Temperature</h2>
        <div class="value" id="temperature">--</div>
        <div class="unit">°C</div>
      </div>

      <div class="card">
        <h2>Pump Status</h2>
        <div class="value" id="pumpStatus">--</div>
        <div class="unit">current state</div>
      </div>
    </div>

    <h2 class="section-title">Recent Readings</h2>

    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Moisture</th>
          <th>Temperature</th>
          <th>Pump</th>
        </tr>
      </thead>
      <tbody id="dataTable">
        <tr>
          <td colspan="4">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <footer>
    Auto-refreshes every 5 seconds
  </footer>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIWFOveXHV3eLVIekOrm9UWTOOtIx5Z9pIXdjs-gjWBSkWDul6n0YkzDIt-SDAlHk/exec";

    async function loadDashboard() {
      try {
        const latestResponse = await fetch(SCRIPT_URL + "?action=latest");
        const latestData = await latestResponse.json();

        updateCards(latestData);

        const recentResponse = await fetch(SCRIPT_URL + "?action=recent");
        const recentData = await recentResponse.json();

        updateTable(recentData);
      } catch (error) {
        console.error(error);
        document.getElementById("status").textContent = "Error loading data.";
      }
    }

    function updateCards(data) {
      document.getElementById("moisture").textContent = data.moisture;
      document.getElementById("temperature").textContent = data.temperature;
      document.getElementById("pumpStatus").textContent = data.pumpStatus;

      document.getElementById("status").textContent =
        "Last updated from sensor: " + data.time;
    }

    function updateTable(rows) {
      const table = document.getElementById("dataTable");
      table.innerHTML = "";

      if (rows.length === 0) {
        table.innerHTML = "<tr><td colspan='4'>No data yet</td></tr>";
        return;
      }

      rows.forEach(row => {
        const tr = document.createElement("tr");

        const pumpClass =
          String(row.pumpStatus).toUpperCase() === "ON" ? "on" : "off";

        tr.innerHTML = `
          <td>${row.time}</td>
          <td>${row.moisture}</td>
          <td>${row.temperature}</td>
          <td class="${pumpClass}">${row.pumpStatus}</td>
        `;

        table.appendChild(tr);
      });
    }

    loadDashboard();
    setInterval(loadDashboard, 5000);
  </script>
</body>
</html>
